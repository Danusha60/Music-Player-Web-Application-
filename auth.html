<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MelodyHub - Login</title>

    <link rel="stylesheet" href="auth.css">
</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <h1>🎵 MelodyHub</h1>
            <p class="subtitle">Your music, your world.</p>

            <!-- Login -->
            <div id="login-section">

                <h2>Login</h2>

                <form id="login-form">

                    <input
                        type="email"
                        id="login-email"
                        placeholder="Email"
                        required
                    >

                    <input
                        type="password"
                        id="login-password"
                        placeholder="Password"
                        required
                    >

                    <button type="submit">
                        Login
                    </button>

                </form>

                <p id="login-message"></p>

                <p class="switch-text">
                    Don't have an account?
                    <button type="button" id="show-register">
                        Register
                    </button>
                </p>

            </div>


            <!-- Register -->
            <div id="register-section" class="hidden">

                <h2>Create Account</h2>

                <form id="register-form">

                    <input
                        type="text"
                        id="register-name"
                        placeholder="Full Name"
                        required
                    >

                    <input
                        type="email"
                        id="register-email"
                        placeholder="Email"
                        required
                    >

                    <input
                        type="password"
                        id="register-password"
                        placeholder="Password"
                        required
                    >

                    <button type="submit">
                        Register
                    </button>

                </form>

                <p id="register-message"></p>

                <p class="switch-text">
                    Already have an account?
                    <button type="button" id="show-login">
                        Login
                    </button>
                </p>

            </div>

        </div>

    </div>

    <script src="auth.js"></script>

</body>
</html>
